# MediaMTX: where every camera's stream arrives, and where the recorder, the Perception
# Workers and the live view read it. Only what differs from MediaMTX's defaults, or what the
# stack relies on, is set here; the defaults are in the image's own /mediamtx.yml.
#
# Paths are not configured here: the reconciler (visionquery-reconciler, ADR 0014) makes them
# match the camera registry through the API, with one publisher per pushed camera, so this file
# never lists a camera or its credentials. Until it has, and again after every restart of
# MediaMTX until its next cycle (seconds), there is no path, so nothing can be published.

logLevel: info
# One JSON object per line, like every VisionQuery process.
logStructured: true

# Who may do what (ADR 0002: Visual Data never leaves the Deployment). Nobody may publish but a
# camera, with its own credentials, to its own path, which the reconciler adds to this list; and
# nobody may read but VisionQuery's own processes. The order matters only for the environment
# override below.
#
# The reconciler rewrites this list to add the cameras' publishers, and MediaMTX never shows a
# password back, so it keeps every user here as it is but cannot keep a password other than its
# own: a user with any other password makes it refuse to change the list. A camera's publisher is
# a user whose one permission is to publish to one path; none is listed here.
authMethod: internal
authInternalUsers:
  # The healthcheck, from inside the container.
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: api
  # Prometheus, on the Compose network; the metrics port is never published.
  - user: any
    pass:
    ips: []
    permissions:
      - action: metrics
  # VisionQuery's own processes: the reconciler drives the API, and the recorder and the
  # Perception Workers read. The password is set by Compose from
  # VISIONQUERY_MEDIAMTX_API_PASSWORD (MTX_AUTHINTERNALUSERS_2_PASS), so the value here is never
  # the one in use.
  - user: visionquery
    pass: set-by-MTX_AUTHINTERNALUSERS_2_PASS
    ips: []
    permissions:
      - action: api
      - action: read
# Credentials are sent in the clear (Basic): MediaMTX can check a hashed password, as every
# camera's publisher's is, only that way.
rtspAuthMethods: [basic]

# The control API the reconciler uses.
api: true
apiAddress: :9997

metrics: true
metricsAddress: :9998

pprof: false
# Footage is played back from the recorder's segments, not by MediaMTX.
playback: false

# Cameras publish or are pulled over RTSP, and processes read over RTSP. TCP only: RTP over
# UDP would need a published port range and loses packets under load.
rtsp: true
rtspTransports: [tcp]
rtspAddress: :8554

# The live view in the browser (M1).
webrtc: true
webrtcAddress: :8889
# Compose sets the port to the published one and the hosts a browser reaches this machine at
# (MTX_WEBRTCLOCALUDPADDRESS, MTX_WEBRTCADDITIONALHOSTS); these are the defaults without it.
webrtcLocalUDPAddress: :8189
webrtcAdditionalHosts: []

# Nothing uses these, so they stay closed. RTMP stays off in particular: stock MediaMTX drops
# an RTMP publisher that sends a track it did not declare (some dashcams add audio late), and
# vision-stack patches that; if RTMP cameras are ever needed, that patch comes with them.
rtmp: false
srt: false
hls: false
moq: false

pathDefaults:
  # The recorder records Footage (ADR 0007); MediaMTX never does.
  record: false

# Every path is the reconciler's (see the top of this file); one it did not add is refused.
paths: {}
