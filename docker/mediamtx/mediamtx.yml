# MediaMTX: where every camera's stream arrives, and where the recorder, the Perception
# Workers and the live view read it. Only what differs from MediaMTX's defaults, or what the
# stack relies on, is set here; the defaults are in the image's own /mediamtx.yml.
#
# Paths are not configured here: the reconciler (M1) makes them match the camera registry
# through the API, so this file never lists a camera or its credentials.

logLevel: info
# One JSON object per line, like every VisionQuery process.
logStructured: true

# Who may do what. The order matters only for the environment override below.
authMethod: internal
authInternalUsers:
  # Cameras publish and the live view reads without credentials, but only from where the
  # published ports reach (loopback by default, see VISIONQUERY_BIND_ADDRESS).
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
  # The healthcheck, from inside the container.
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: api
  # Prometheus, on the Compose network; the metrics port is never published.
  - user: any
    pass:
    ips: []
    permissions:
      - action: metrics
  # VisionQuery's own processes, such as the reconciler. The password is set by Compose
  # from VISIONQUERY_MEDIAMTX_API_PASSWORD (MTX_AUTHINTERNALUSERS_3_PASS), so the value
  # here is never the one in use.
  - user: visionquery
    pass: set-by-MTX_AUTHINTERNALUSERS_3_PASS
    ips: []
    permissions:
      - action: api
      - action: publish
      - action: read

# The control API the reconciler uses (M1).
api: true
apiAddress: :9997

metrics: true
metricsAddress: :9998

pprof: false
# Footage is played back from the recorder's segments, not by MediaMTX.
playback: false

# Cameras publish or are pulled over RTSP, and processes read over RTSP. TCP only: RTP over
# UDP would need a published port range and loses packets under load.
rtsp: true
rtspTransports: [tcp]
rtspAddress: :8554

# The live view in the browser (M1).
webrtc: true
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189

# Nothing uses these, so they stay closed. RTMP stays off in particular: stock MediaMTX drops
# an RTMP publisher that sends a track it did not declare (some dashcams add audio late), and
# vision-stack patches that; if RTMP cameras are ever needed, that patch comes with them.
rtmp: false
srt: false
hls: false
moq: false

pathDefaults:
  # The recorder records Footage (ADR 0007); MediaMTX never does.
  record: false

paths:
  # Any path may be published to until the reconciler (M1) manages them.
  all_others:
