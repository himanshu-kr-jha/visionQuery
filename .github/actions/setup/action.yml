name: Set up the workspace
description: >-
  Installs uv (which installs the Python .python-version pins) and the workspace from uv.lock,
  and with `web: true` Node from web/.nvmrc and the web app from its lockfile too, as
  `make sync` does on a developer's machine. uv's and npm's downloads are cached. With
  `sync: false` it installs only the tools, as the README's prerequisites have a developer do,
  and leaves installing the workspace to the job.

inputs:
  web:
    description: Also install Node and the web app's dependencies.
    default: "false"
  sync:
    description: Install the workspace (and with `web`, the web app) from the lockfiles.
    default: "true"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        # The uv the image is built with (Dockerfile); tests/test_ci.py keeps them equal.
        version: "0.11.7"
        enable-cache: true
        cache-python: true
        cache-dependency-glob: |
          uv.lock
          .python-version
        # Every job installs the same, so one job saves the cache instead of all racing to.
        save-cache: ${{ github.job == 'lint' }}
    - if: inputs.web == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: web/.nvmrc
        cache: npm
        cache-dependency-path: web/package-lock.json
    - if: inputs.sync == 'true' && inputs.web == 'true'
      shell: bash
      run: make sync
    - if: inputs.sync == 'true' && inputs.web != 'true'
      shell: bash
      run: uv sync --locked
