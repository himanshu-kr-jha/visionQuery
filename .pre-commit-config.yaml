# The fast checks, run by git as a commit is made; CI (.github/workflows/ci.yml) runs these
# and every other check again on each PR.
#
# Opt in with `uv run pre-commit install`, which installs a pre-commit and a commit-msg hook
# into .git/hooks, replacing any hook of those names already there.
#
# Every hook is local and runs the workspace's own tools through uv, so a hook uses exactly
# the version uv.lock pins, the same one `make check` and CI use, and never a second copy
# pinned here that could drift from it. `tests/test_pre_commit.py` runs each hook.
minimum_pre_commit_version: "4.7.0"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude
        language: unsupported
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: unsupported
        types_or: [python, pyi]
        require_serial: true
      - id: conventional-commit
        name: Conventional Commit message
        entry: uv run --frozen python scripts/check_commit_message.py
        language: unsupported
        stages: [commit-msg]
      - id: no-attribution
        name: no agent attribution in the message
        entry: uv run --frozen python scripts/check_attribution.py
        language: unsupported
        stages: [commit-msg]
