# The VisionQuery stack.
#
#   make bootstrap                    checks the prerequisites, writes .env, installs
#   make up                           Postgres, migrations, MediaMTX, its reconciler and the
#                                     api; no GPU
#   make up COMPOSE_PROFILES=observability     adds Prometheus and Grafana
#   make up COMPOSE_PROFILES=gpu               adds Triton on the host's GPUs
#   make up COMPOSE_PROFILES=dev               adds fake cameras (`make fetch-samples` first)
#   make down                         stop everything, whatever its profile; the data stays
#   make down VOLUMES=1               stop, and delete the data (database, metrics) too
# `make up` builds the images (so changed code is what runs), brings the stack up and checks
# that `migrate` exited 0, which `docker compose up --wait` does not: it returns while a
# migration is still running. A bare `docker compose up` builds only an absent image, so after
# changing code or a Dockerfile use `make up`, or run
# `BUILDX_NO_DEFAULT_ATTESTATIONS=1 docker compose build` first.
# Needs Docker Engine 25 or newer and Compose 2.30 or newer (`compose wait`).
#
# Profiles:
#   gpu            Triton, reserving every GPU. On a machine without one, add
#                  `-f compose.yaml -f compose.no-gpu.yaml` to run it on the CPU.
#   observability  Prometheus scraping every service's /metrics, and Grafana reading it.
#   dev            fake cameras looping sample videos into MediaMTX, for development, registered
#                  in the camera registry first.
#
# Every variable is documented in .env.example. Ports are published on
# VISIONQUERY_BIND_ADDRESS (loopback unless set) and each has a variable of its own; only
# MediaMTX's camera-facing ports use VISIONQUERY_MEDIAMTX_BIND_ADDRESS, so opening them to
# cameras never opens anything else.

name: visionquery

x-service: &service
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

# What every VisionQuery process shares: the one image (Dockerfile) and the runtime's settings.
x-visionquery: &visionquery
  <<: *service
  # Named for the project, never `visionquery:dev`: image tags are global to the Docker daemon,
  # and Compose stamps the project's name into the labels of every image it builds, so two
  # projects (two clones, a stack test beside a developer's stack) building the same tag would
  # give it a different image ID each time, and each one's next `make up` would recreate its
  # containers and drop live streams. One name for every VisionQuery service means one build and
  # one set of layers per project.
  image: ${COMPOSE_PROJECT_NAME}-app:dev
  # Only `migrate` builds it (`build: .` there): Compose stamps the building service's name into
  # the image's labels, so two services building the one tag would race, and whichever finished
  # last would leave an image ID the other's next build replaces, recreating every container on
  # every `make up`. The others run what migrate built, which they wait for anyway.
  # Never pulled (it exists only on this host) and never rebuilt by a bare `docker compose up`,
  # which so leaves running streams alone; Compose still builds it when it is absent. `make up`
  # builds first, with BuildKit's attestations off
  # (BUILDX_NO_DEFAULT_ATTESTATIONS=1, which Compose 5.1 cannot be told in this file): an
  # attestation carries a timestamp, so every build would give a new image ID even when no
  # layer changed, and Compose recreates a container whose image ID changed, which would drop
  # live streams on every `make up`. Without attestations an unchanged tree gives the same ID,
  # so only the service whose code changed is recreated.
  pull_policy: never
  read_only: true
  tmpfs: [/tmp]

# The runtime's settings every VisionQuery process is given. A service's `environment` merges
# them in (`<<: *runtime-environment`), because a map of its own replaces, not extends, one
# inherited from x-visionquery; tests/test_compose.py checks that each one does.
x-runtime-environment: &runtime-environment
  VISIONQUERY_LOG_LEVEL: ${VISIONQUERY_LOG_LEVEL:-INFO}
  # The runtime serves /metrics on loopback unless told otherwise, which Prometheus, in a
  # container of its own, cannot reach. The port is never published on the host.
  VISIONQUERY_METRICS_HOST: 0.0.0.0

services:
  postgres:
    <<: *service
    # TimescaleDB on PostgreSQL 18, with pgvector bundled (ADR 0006).
    image: timescale/timescaledb:2.30.1-pg18@sha256:9dede0e3ccc071cf71935b17f76bf243331df0b1575338c8ac294640fcf12a36
    environment:
      POSTGRES_USER: visionquery
      POSTGRES_DB: visionquery
      POSTGRES_PASSWORD: ${VISIONQUERY_POSTGRES_PASSWORD:?set VISIONQUERY_POSTGRES_PASSWORD in .env (see .env.example)}
      # The image would otherwise tune itself on every start and rewrite postgresql.conf.
      NO_TS_TUNE: "true"
    # A Deployment is closed (ADR 0001, ADR 0002), so TimescaleDB never reports home.
    command: ["postgres", "-c", "timescaledb.telemetry_level=off"]
    shm_size: 256m
    volumes:
      # PostgreSQL 18 images keep PGDATA in a versioned directory under this one.
      - postgres:/var/lib/postgresql
    ports:
      - "${VISIONQUERY_BIND_ADDRESS:-127.0.0.1}:${VISIONQUERY_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      # Over TCP: while the image initialises a new database it listens on its socket only,
      # so a socket check would pass before the server that stays is up.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=visionquery", "--dbname=visionquery"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 1s

  # Brings the schema up to date, then exits; safe to run on every start (ADR 0011).
  # `up --wait` returns while this still runs, so start the stack with `make up`, which also
  # fails when it did not exit 0.
  # EVERY long-running service built from the VisionQuery image (recorder, linker, api...) must
  # declare `depends_on: { migrate: { condition: service_completed_successfully } }`;
  # tests/test_compose.py fails until it does.
  migrate:
    <<: *visionquery
    # The one service that builds the VisionQuery image (see x-visionquery).
    build: .
    restart: "no"
    command: ["visionquery-migrate"]
    environment:
      <<: *runtime-environment
      # The password is not part of the URL, where `@`, `/`, `:` or `#` in it would break the
      # URL: libpq reads it from PGPASSWORD, so any password works.
      VISIONQUERY_DATABASE__URL: postgresql://visionquery@postgres:5432/visionquery
      PGPASSWORD: ${VISIONQUERY_POSTGRES_PASSWORD:?set VISIONQUERY_POSTGRES_PASSWORD in .env (see .env.example)}
    depends_on:
      postgres:
        condition: service_healthy

  # The HTTP api the web app and Operators use (`visionquery-api`).
  api:
    <<: *visionquery
    command: ["visionquery-api"]
    environment:
      <<: *runtime-environment
      # The api listens on loopback unless told otherwise; in a container that would be
      # unreachable from outside it. Who can reach the published port is decided below
      # (VISIONQUERY_BIND_ADDRESS), not here.
      VISIONQUERY_HTTP_HOST: 0.0.0.0
      # As for migrate: the password is in PGPASSWORD, never in the URL.
      VISIONQUERY_DATABASE__URL: postgresql://visionquery@postgres:5432/visionquery
      PGPASSWORD: ${VISIONQUERY_POSTGRES_PASSWORD:?set VISIONQUERY_POSTGRES_PASSWORD in .env (see .env.example)}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${VISIONQUERY_BIND_ADDRESS:-127.0.0.1}:${VISIONQUERY_API_PORT:-8080}:8080"
    healthcheck:
      # /health reports readiness, not just that the process runs: it answers 503 while the api
      # cannot reach the database, so an api that could answer nothing is not marked healthy.
      # The image has no curl or wget, so its own Python asks; urlopen fails on that 503.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s

  # Keeps MediaMTX's paths and publishers matching the camera registry (visionquery-reconciler,
  # ADR 0014): every VISIONQUERY_RECONCILE_INTERVAL seconds, so a camera added, changed or
  # removed, and a restarted MediaMTX, are put right within one cycle. Healthy while a recent
  # cycle succeeded.
  reconciler:
    <<: *visionquery
    command: ["visionquery-reconciler"]
    environment:
      <<: *runtime-environment
      # As for migrate: the password is in PGPASSWORD, never in the URL.
      VISIONQUERY_DATABASE__URL: postgresql://visionquery@postgres:5432/visionquery
      PGPASSWORD: ${VISIONQUERY_POSTGRES_PASSWORD:?set VISIONQUERY_POSTGRES_PASSWORD in .env (see .env.example)}
      VISIONQUERY_MEDIAMTX__URL: http://mediamtx:9997
      VISIONQUERY_MEDIAMTX__PASSWORD: ${VISIONQUERY_MEDIAMTX_API_PASSWORD:?set VISIONQUERY_MEDIAMTX_API_PASSWORD in .env (see .env.example)}
      VISIONQUERY_RECONCILE_INTERVAL: ${VISIONQUERY_RECONCILE_INTERVAL:-5}
    depends_on:
      migrate:
        condition: service_completed_successfully
      mediamtx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "visionquery-reconciler", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s

  mediamtx:
    <<: *service
    # Named for the project, for the reason given at x-visionquery.
    image: ${COMPOSE_PROJECT_NAME}-mediamtx:1.21.1
    build: docker/mediamtx
    pull_policy: never
    read_only: true
    environment:
      # The address a browser sends WebRTC media to; the container cannot know it.
      MTX_WEBRTCADDITIONALHOSTS: ${VISIONQUERY_MEDIAMTX_WEBRTC_HOSTS:-127.0.0.1}
      # The port is announced to the browser as it is inside, so the host publishes the same number.
      MTX_WEBRTCLOCALUDPADDRESS: ":${VISIONQUERY_MEDIAMTX_WEBRTC_UDP_PORT:-8189}"
      MTX_AUTHINTERNALUSERS_2_PASS: ${VISIONQUERY_MEDIAMTX_API_PASSWORD:?set VISIONQUERY_MEDIAMTX_API_PASSWORD in .env (see .env.example)}
    volumes:
      # The directory, not the file: MediaMTX reloads its configuration when the file changes,
      # and a bind-mounted file would keep showing the copy an editor replaced.
      - ./docker/mediamtx:/etc/mediamtx:ro
    ports:
      - "${VISIONQUERY_MEDIAMTX_BIND_ADDRESS:-127.0.0.1}:${VISIONQUERY_MEDIAMTX_RTSP_PORT:-8554}:8554"
      - "${VISIONQUERY_BIND_ADDRESS:-127.0.0.1}:${VISIONQUERY_MEDIAMTX_API_PORT:-9997}:9997"
      - "${VISIONQUERY_MEDIAMTX_BIND_ADDRESS:-127.0.0.1}:${VISIONQUERY_MEDIAMTX_WEBRTC_PORT:-8889}:8889"
      # WebRTC media, on the same number inside and out (see MTX_WEBRTCLOCALUDPADDRESS).
      - "${VISIONQUERY_MEDIAMTX_BIND_ADDRESS:-127.0.0.1}:${VISIONQUERY_MEDIAMTX_WEBRTC_UDP_PORT:-8189}:${VISIONQUERY_MEDIAMTX_WEBRTC_UDP_PORT:-8189}/udp"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9997/v3/paths/list"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s

  triton:
    <<: *service
    profiles: [gpu]
    image: nvcr.io/nvidia/tritonserver:26.09-py3@sha256:350820308a0e62efbb22f9d4e5b29c970b7c7a54f7b275674e457e5fd8bab1a5
    command:
      - tritonserver
      - --model-repository=/models
      - --log-format=ISO8601
    # What NVIDIA asks for: room for shared memory, locked memory and deep stacks.
    shm_size: 1g
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      - ./docker/triton/models:/models:ro
    ports:
      - "${VISIONQUERY_BIND_ADDRESS:-127.0.0.1}:${VISIONQUERY_TRITON_HTTP_PORT:-8000}:8000"
      - "${VISIONQUERY_BIND_ADDRESS:-127.0.0.1}:${VISIONQUERY_TRITON_GRPC_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8000/v2/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s
    # compose.no-gpu.yaml removes this on a machine without a GPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # With the gpu profile, tells Prometheus where Triton's metrics are: it writes a file that
  # Prometheus reads (file_sd), so that without the profile there is no target and no lookup
  # of a name that does not resolve, which Prometheus would log as an error every 15 s.
  # The file stays in the volume once written, so a stack that ran Triton and then stopped it
  # shows the target as down until the volume alone is removed, with the stack down:
  # `docker volume rm visionquery_scrape-targets` (`<project>_scrape-targets`). Not
  # `down --volumes`, which deletes the database too. The volume is shared between two
  # containers, so it cannot be a tmpfs, and it must outlive `down` for the metrics of a
  # stack that is only restarted.
  triton-scrape:
    <<: *service
    profiles: [gpu]
    restart: "no"
    image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    command: ["sh", "-c", "echo '- targets: [\"triton:8002\"]' > /targets/triton.yml"]
    read_only: true
    volumes:
      - scrape-targets:/targets

  prometheus:
    <<: *service
    profiles: [observability]
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
      - scrape-targets:/etc/prometheus-targets:ro
      - prometheus:/prometheus
    depends_on:
      # Only when the gpu profile is on: then its file is written before Prometheus starts.
      triton-scrape:
        condition: service_completed_successfully
        required: false
    ports:
      - "${VISIONQUERY_BIND_ADDRESS:-127.0.0.1}:${VISIONQUERY_PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s

  grafana:
    <<: *service
    profiles: [observability]
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${VISIONQUERY_GRAFANA_ADMIN_PASSWORD:?set VISIONQUERY_GRAFANA_ADMIN_PASSWORD in .env (see .env.example)}
      # A Deployment is closed: no usage reports, update checks or news feed.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana:/var/lib/grafana
    ports:
      - "${VISIONQUERY_BIND_ADDRESS:-127.0.0.1}:${VISIONQUERY_GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s

  # Development only: cameras that loop videos into MediaMTX over RTSP, one path each
  # (docker/fake-cameras/fake_cameras.py). VISIONQUERY_FAKE_CAMERAS lists them as name=video;
  # the videos are read from VISIONQUERY_FAKE_CAMERA_SAMPLES, where `make fetch-samples` puts
  # the ones samples/manifest.toml lists, and `synthetic` is a test pattern needing no video.
  # Each video is re-encoded once as a camera would send it and kept in the `fake-cameras`
  # volume, then looped without transcoding. Every camera shows the same moment of its video
  # as every other (all are cut to VISIONQUERY_FAKE_CAMERA_DURATION seconds and follow the wall
  # clock), also after a restart. Each camera reconnects by itself when MediaMTX restarts. Not scraped by Prometheus: it is never part of a Deployment.
  # Development only: registers each fake camera as a pushed camera publishing as itself with
  # VISIONQUERY_FAKE_CAMERA_PASSWORD (scripts/register_fake_cameras.py), since MediaMTX lets
  # only registered cameras publish, each with its own credentials. Runs once, in the
  # VisionQuery image, before the fake cameras start.
  register-fake-cameras:
    <<: *visionquery
    profiles: [dev]
    restart: "no"
    command: ["python", "/scripts/register_fake_cameras.py"]
    environment:
      <<: *runtime-environment
      VISIONQUERY_DATABASE__URL: postgresql://visionquery@postgres:5432/visionquery
      PGPASSWORD: ${VISIONQUERY_POSTGRES_PASSWORD:?set VISIONQUERY_POSTGRES_PASSWORD in .env (see .env.example)}
      VISIONQUERY_FAKE_CAMERAS: ${VISIONQUERY_FAKE_CAMERAS:-gym-g299=meva-school-g299.avi,gym-g330=meva-school-g330.avi,stairs-g420=meva-school-g420.avi}
      VISIONQUERY_FAKE_CAMERA_PASSWORD: ${VISIONQUERY_FAKE_CAMERA_PASSWORD:?set VISIONQUERY_FAKE_CAMERA_PASSWORD in .env (see .env.example)}
    volumes:
      # The script and the fake cameras' own reading of VISIONQUERY_FAKE_CAMERAS, which it imports.
      - ./scripts/register_fake_cameras.py:/scripts/register_fake_cameras.py:ro
      - ./docker/fake-cameras/fake_cameras.py:/scripts/fake_cameras.py:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  fake-cameras:
    <<: *service
    profiles: [dev]
    # Named for the project, for the reason given at x-visionquery.
    image: ${COMPOSE_PROJECT_NAME}-fake-cameras:dev
    build: docker/fake-cameras
    pull_policy: never
    read_only: true
    tmpfs: [/tmp]
    environment:
      FAKE_CAMERAS: ${VISIONQUERY_FAKE_CAMERAS:-gym-g299=meva-school-g299.avi,gym-g330=meva-school-g330.avi,stairs-g420=meva-school-g420.avi}
      FAKE_CAMERAS_RTSP: rtsp://mediamtx:8554
      FAKE_CAMERAS_DURATION: ${VISIONQUERY_FAKE_CAMERA_DURATION:-300}
      # Each camera publishes as the user named for it with this, as registered above.
      FAKE_CAMERAS_PASSWORD: ${VISIONQUERY_FAKE_CAMERA_PASSWORD:?set VISIONQUERY_FAKE_CAMERA_PASSWORD in .env (see .env.example)}
    volumes:
      - ${VISIONQUERY_FAKE_CAMERA_SAMPLES:-./samples}:/samples:ro
      - fake-cameras:/cache
    depends_on:
      mediamtx:
        condition: service_healthy
      # Registered, and in MediaMTX once the reconciler has run a cycle since (seconds; each
      # camera retries publishing meanwhile).
      register-fake-cameras:
        condition: service_completed_successfully
      reconciler:
        condition: service_healthy
    healthcheck:
      # Every camera's ffmpeg sent a frame in the last 5 s. A sample being prepared is replaced
      # by the test pattern meanwhile, so the cameras are up within seconds even the first time.
      test: ["CMD", "fake-cameras", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s

  # Postgres's metrics for Prometheus; never published on the host.
  postgres-exporter:
    <<: *service
    profiles: [observability]
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    environment:
      DATA_SOURCE_URI: postgres:5432/visionquery?sslmode=disable
      DATA_SOURCE_USER: visionquery
      DATA_SOURCE_PASS: ${VISIONQUERY_POSTGRES_PASSWORD:?set VISIONQUERY_POSTGRES_PASSWORD in .env (see .env.example)}
    read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9187/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s

volumes:
  scrape-targets:
  fake-cameras:
  postgres:
  prometheus:
  grafana:
