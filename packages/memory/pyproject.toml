[project]
name = "visionquery-memory"
version = "0.1.0"
description = "Domain model and the only code that touches Postgres, including embedding search (ADR 0006)."
requires-python = "==3.14.*"
dependencies = [
    "argon2-cffi>=25.1.0",
    "psycopg[binary]>=3.3.6",
    "visionquery-runtime",
]

[project.scripts]
visionquery-migrate = "visionquery.memory.migrate:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "visionquery.memory"
