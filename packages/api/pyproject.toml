[project]
name = "visionquery-api"
version = "0.1.0"
description = "The HTTP api over tools."
requires-python = "==3.14.*"
dependencies = [
    "fastapi>=0.143.3",
    "uvicorn>=0.54.0",
    "visionquery-memory",
    "visionquery-runtime",
]

[project.scripts]
visionquery-api = "visionquery.api.serve:main"
visionquery-openapi = "visionquery.api.openapi:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "visionquery.api"

